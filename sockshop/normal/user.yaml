# 2026-10-17 上流 (upstream/manifests) から生成。namespace を外し (apply -n exp)、mongo を 3.4 に固定、
# nodeSelector を kubernetes.io/os に、Istio 注入なし、枠は測定用の仮 (アプリ 200m / DB 等 100m、上限 2000m、メモリは上流のまま)。
# 2026-10-19: readinessProbe を 8 つのアプリで統一 (initialDelaySeconds 10、他は既定 = period 10 s / timeout 1 s / failure 3。OB の km2/normal と同じ)。
#   上流は catalogue/payment/user 180 s、front-end 30 s (period 3 s)、Java 4 つは無し。livenessProbe は上流のまま。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    name: user
spec:
  replicas: 1
  selector:
    matchLabels:
      name: user
  template:
    metadata:
      labels:
        name: user
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      containers:
      - name: user
        image: weaveworksdemos/user:0.4.7
        resources:
          requests:
            cpu: 200m
            memory: 100Mi
          limits:
            cpu: 2000m
            memory: 200Mi
        ports:
        - containerPort: 80
        env:
        - name: mongo
          value: user-db:27017
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - all
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 300
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: user
  annotations:
    prometheus.io/scrape: 'true'
  labels:
    name: user
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    name: user
