
# ============================================================
# scaling/ 実験 — 【集約版】 recommendation + payment を 1 Pod に同居
#   案B: 2サービスを同一 Pod に詰め、Pod ごと一緒に HPA でスケールさせる
#   (= レプリカ結合の無駄 ∫|a-b| が出る実験群)
#
#   ・reco と payment は互いに通信しない「遠いペア」なので localhost 配線は不要。
#     同居の狙いは Pod/Envoy 固定費の共有(静的メリット)とスケールの結合(動的な無駄)。
#   ・reco は productcatalog を Service DNS 経由で呼ぶ(外部依存は変わらない)。
#   ・payment は checkout から Service DNS 経由で呼ばれる(Service 名は据え置き)。
#
#   ※この1ファイルが reco と payment の Deployment/Service/SA/HPA を全部定義する。
#     colocated/ では従来の recommendationservice.yaml と paymentservice.yaml を
#     削除すること(二重デプロイ防止)。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reco-payment
  labels:
    app: reco-payment
spec:
  # replicas は指定しない(HPA が管理する)
  selector:
    matchLabels:
      app: reco-payment
  template:
    metadata:
      annotations:
        # 【静的メリットのレバー】Envoy を 1 Pod に 1 枚だけ注入(分離版は 2 枚)。
        #   τ を内点へ押し込む実験では true、Envoy 無しの素のベースラインを測るときは false。
        #   ★分離版(reco/payment 両方)とこの値を必ず一致させること(でないと税の差が壊れる)。
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/proxyCPU: "240m"
        sidecar.istio.io/proxyCPULimit: "400m"
        prometheus.io/scrape: "true"
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15090"
      labels:
        app: reco-payment
    spec:
      serviceAccountName: reco-payment
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      # ---- コンテナ1: recommendationservice ----
      - name: recommend
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        livenessProbe:
          periodSeconds: 30
          grpc:
            port: 8080
        env:
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"   # 外部依存(DNS 経由)。同居しても変わらない
        - name: DISABLE_PROFILER
          value: "1"
        resources:
          requests:
            cpu: 150m       # ← HPA(server メトリクス)はこの requests に対する使用率で判断
            memory: 220Mi
          limits:
            cpu: 200m
            memory: 450Mi
      # ---- コンテナ2: paymentservice ----
      - name: payment
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.3
        ports:
        - containerPort: 50051
        readinessProbe:
          grpc:
            port: 50051
        livenessProbe:
          grpc:
            port: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1"
        resources:
          requests:
            cpu: 200m       # ← HPA(payment メトリクス)はこの requests に対する使用率で判断
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
---
# ---- recommendationservice の Service(DNS 名は据え置き → frontend からの呼び出しは無改変) ----
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  type: ClusterIP
  selector:
    app: reco-payment        # ★同居 Pod を指す
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
---
# ---- paymentservice の Service(DNS 名は据え置き → checkout からの呼び出しは無改変) ----
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  labels:
    app: paymentservice
spec:
  type: ClusterIP
  selector:
    app: reco-payment        # ★同じ同居 Pod を指す(ポート違いで両 Service が同居)
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reco-payment
---
# ---- 結合 HPA: Pod ごと一緒にスケール ----
#   ContainerResource を 2 本並べる → HPA は各メトリクスの desired の最大を採用
#   → desired = max(a,b)。これが「忙しい方に合わせて Pod を増やす」= モデルの max(a,b)。
#   分離版の 2 つの独立 HPA と min/max/target を完全一致させること(公平な対照)。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reco-payment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reco-payment
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: ContainerResource
    containerResource:
      name: cpu
      container: recommend           # recommendation の必要枚数 a(t)
      target:
        type: Utilization
        averageUtilization: 70
  - type: ContainerResource
    containerResource:
      name: cpu
      container: payment          # payment の必要枚数 b(t)
      target:
        type: Utilization
        averageUtilization: 70
