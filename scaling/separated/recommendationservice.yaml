# ============================================================
# scaling/ 実験 — 【分離版】 recommendationservice
#   案B: 2サービスを別Podに分け、それぞれ独立に HPA でスケールさせる
#   (= レプリカ結合の無駄が無い対照群)
#   recommendation は productcatalog を Service DNS 経由で呼ぶ。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  # replicas は指定しない(HPA が管理する)
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      annotations:
        # 【静的メリットのレバー】集約版(pair-reco-payment)と必ず一致させること。
        # true = 分離は Envoy 2 枚 / 集約は 1 枚 → 静的メリットが生まれる(τ実験の本番)。
        # Envoy 無しの素のベースラインを測るときは集約版ともども false に揃える。
        sidecar.istio.io/inject: "true"
      labels:
        app: recommendationservice
    spec:
      serviceAccountName: recommendationservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        livenessProbe:
          periodSeconds: 30
          grpc:
            port: 8080
        env:
        - name: PORT
          value: "8080"
        # 【分離】Service DNS 経由で productcatalog に到達
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: DISABLE_PROFILER
          value: "1"
        resources:
          requests:
            cpu: 150m       # ← HPA はこの requests に対する使用率で判断する
            memory: 220Mi
          limits:
            cpu: 200m
            memory: 450Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  type: ClusterIP
  selector:
    app: recommendationservice
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendationservice
---
# ---- 独立スケール: recommendation 専用 HPA ----
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendationservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendationservice
  minReplicas: 1
  maxReplicas: 6          # 単一ノードの容量に合わせて調整
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
