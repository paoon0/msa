# ============================================================
# scaling/ 実験 — loadgenerator3 (方法2: 直接 gRPC・位相制御負荷)
#   recommendationservice と paymentservice へ frontend を介さず直接 gRPC を投げ、
#   2 本の正弦波の位相差 PHASE_DEG で需要相関 ρ=cos(φ) を掃引する。
#
#   使い方(分離版/集約版どちらでも同じ。Service 名が同じなので宛先は不変):
#     kubectl apply -f scaling/loadgenerator3.yaml -n exp
#   ρ を変えるには PHASE_DEG を書き換えて再 apply:
#     +1 → 0 / 無相関 → 90 / -0.8 → 143 / -1 → 180
#
#   イメージは src/loadgenerator3 からビルド:
#     docker build -t mizuki0118/loadgen3:run1 src/loadgenerator3 && docker push mizuki0118/loadgen3:run1
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgenerator3
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        # 負荷生成側は計測対象(system-under-test)ではないので Envoy を入れない。
        sidecar.istio.io/inject: "false"
      labels:
        app: loadgenerator3
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      containers:
      - name: main
        image: mizuki0118/loadgen3:run1
        imagePullPolicy: Always
        env:
        # --- 接続先(分離版・集約版とも Service 名は同一) ---
        - name: RECO_ADDR
          value: "recommendationservice:8080"
        - name: PAY_ADDR
          value: "paymentservice:50051"
        # --- 負荷プロファイル(つまみ) ---
        - name: BASE_RPS      # 平均到着率 [req/s]
          value: "30"
        - name: AMP_RPS       # 振幅 σ [req/s]
          value: "20"
        - name: PERIOD_S      # 1 周期 [s]
          value: "120"
        - name: PHASE_DEG     # ★ρ=cos(φ): 0→+1, 90→0, 143→-0.8, 180→-1
          value: "0"
        - name: RUN_TIME_S    # 総実行時間 [s] (13 分。最後 10 分を本計測窓に)
          value: "780"
        - name: MAX_INFLIGHT
          value: "400"
        resources:
          requests:
            cpu: 300m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
