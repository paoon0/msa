# 案①(通信時間の確認)用：処理ゼロのエコーサーバ（ClusterIP アーム）
# Fortio(Istio プロジェクトの負荷/ベンチツール)の gRPC PingServer を使う。
# `fortio server` は gRPC ping を 8079 で待ち受ける。ping は最小ペイロードを返すだけ＝処理ほぼゼロ。
# ドライバ側 `fortio load -grpc -ping` がこの ping を叩き、レイテンシ分位点(p50/p99…)を出す。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: exp
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo-server }
  template:
    metadata:
      labels: { app: echo-server }
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:latest
          args: ["server", "-grpc-port", "8079"]
          ports:
            - { containerPort: 8079 }
          readinessProbe:        # 8079 が listen するまで Service に載せない
            tcpSocket: { port: 8079 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: exp
spec:
  selector: { app: echo-server }
  ports:
    - { name: grpc, port: 8079, targetPort: 8079 }
