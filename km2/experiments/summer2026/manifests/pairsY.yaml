# pairsY: 同居ペア前向き検証の第2配置 (2026-10-08 作成)。3 Pod を同時に同居させる。
#   productcatalogservice + paymentservice         (辺なしペア)
#   shippingservice       + recommendationservice  (辺なしペア)
#   frontend              + checkoutservice        (frontend → checkout は localhost)
# 束ねていない cartservice(+redis-cart) / currencyservice / emailservice / adservice は km2/normal のまま。
# Deployment 名とコンテナ名 (枠の置換 apply_rightsize.py / sample_hpa.py と整合):
#   Deployment productcatalogservice: コンテナ server(catalog:3550) / payment(50051)
#   Deployment shippingservice      : コンテナ server(shipping:50051) / recommendation(reco:8080)
#   Deployment frontend             : コンテナ server(frontend:8080) / checkout(5050,metrics 9464)
# 吸収される側の Service (paymentservice / recommendationservice / checkoutservice) は同居 Pod のラベルを向ける。
# frontend-external (LoadBalancer) は frontcheckout.yaml と同じく作らない (k6 は frontend:80 を叩く)。
# Pod 内ポート衝突なし: catalog 3550 / payment 50051 | shipping 50051 / reco 8080 | frontend 8080 / checkout 5050,9464。
# localhost にしたのは frontend→checkout の 1 本だけ。reco→catalog は別 Pod (productcatalogservice:3550) のまま。
# なお reco は catalog と別 Pod に居るので、reco の PRODUCT_CATALOG_SERVICE_ADDR は Service 名のまま。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.3
        ports:
        - containerPort: 3550
        readinessProbe: { grpc: { port: 3550 } }
        livenessProbe:  { grpc: { port: 3550 } }
        env:
        - { name: PORT, value: "3550" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 600m, memory: 64Mi }
          limits:   { cpu: 1000m, memory: 128Mi }

      - name: payment
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.3
        ports:
        - containerPort: 50051
        readinessProbe: { grpc: { port: 50051 } }
        livenessProbe:  { grpc: { port: 50051 } }
        env:
        - { name: PORT, value: "50051" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 200m, memory: 64Mi }
          limits:   { cpu: 300m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  labels:
    app: shippingservice
spec:
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: shippingservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/shippingservice:v0.10.3
        ports:
        - containerPort: 50051
        readinessProbe:
          periodSeconds: 5
          grpc: { port: 50051 }
        livenessProbe:
          grpc: { port: 50051 }
        env:
        - { name: PORT, value: "50051" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 320m, memory: 64Mi }
          limits:   { cpu: 560m, memory: 128Mi }

      - name: recommendation
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          grpc: { port: 8080 }
        livenessProbe:
          periodSeconds: 30
          grpc: { port: 8080 }
        env:
        - { name: PORT, value: "8080" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 1200m, memory: 220Mi }
          limits:   { cpu: 1600m, memory: 450Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-readiness-probe" }
        livenessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-liveness-probe" }
        env:
        - { name: PORT, value: "8080" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
        - { name: RECOMMENDATION_SERVICE_ADDR, value: "recommendationservice:8080" }
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: CHECKOUT_SERVICE_ADDR, value: "localhost:5050" }   # ← 同居先へ loopback
        - { name: AD_SERVICE_ADDR, value: "adservice:9555" }
        - { name: SHOPPING_ASSISTANT_SERVICE_ADDR, value: "shoppingassistantservice:80" }
        - { name: ENABLE_PROFILER, value: "0" }
        resources:
          requests: { cpu: 1000m, memory: 128Mi }
          limits:   { cpu: 1600m, memory: 256Mi }

      - name: checkout
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: mizuki0118/mygo:bunpupaymail
        ports:
        - { name: grpc,    containerPort: 5050 }
        - { name: metrics, containerPort: 9464 }
        readinessProbe: { grpc: { port: 5050 } }
        livenessProbe:  { grpc: { port: 5050 } }
        env:
        - { name: PORT, value: "5050" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: PAYMENT_SERVICE_ADDR, value: "paymentservice:50051" }
        - { name: EMAIL_SERVICE_ADDR, value: "emailservice:5000" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
        resources:
          requests: { cpu: 800m, memory: 64Mi }
          limits:   { cpu: 1200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels: { app: productcatalogservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 3550, targetPort: 3550 }
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  labels: { app: paymentservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  labels: { app: shippingservice }
spec:
  type: ClusterIP
  selector: { app: shippingservice }
  ports:
  - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels: { app: recommendationservice }
spec:
  type: ClusterIP
  selector: { app: shippingservice }
  ports:
  - { name: grpc, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels: { app: checkoutservice }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: grpc, port: 5050, targetPort: 5050 }
  - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: productcatalogservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: paymentservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: shippingservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: recommendationservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: checkoutservice }
