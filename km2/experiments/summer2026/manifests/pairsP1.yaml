  - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  labels: { app: emailservice }
spec:
  type: ClusterIP
  selector: { app: paymentservice }
  ports:
