# pairsP1: ペア距離実験 (P の近さ) の第1配置 (2026-10-13 作成)。3 Pod を同時に同居させる。
#   frontend        + recommendationservice  (frontend → reco は localhost:8090 = 実辺あり)
#   paymentservice  + emailservice           (辺なしペア)
#   currencyservice + shippingservice        (辺なしペア)
# 束ねていない checkoutservice / cartservice(+redis-cart) / productcatalogservice / adservice は km2/normal のまま (bundle-vs-loss2.sh の apply_arm が別途 apply)。
# Deployment 名とコンテナ名 (枠の置換 apply_rightsize.py / sample_hpa.py と整合):
#   Deployment frontend       : コンテナ server(frontend:8080) / recommendation(reco:8090 に remap)
#   Deployment paymentservice : コンテナ payment(50051) / email(8080。Service は 5000→8080)
#   Deployment currencyservice: コンテナ server(currency:7000) / shipping(50051)
# 吸収される側の Service (recommendationservice / emailservice / shippingservice) は同居 Pod のラベルを向ける。
#   recommendationservice は port 8080 のまま targetPort 8090 (frontreco.yaml と同じ。数値の targetPort なので grpc_lb_patch.py も正しく書き換えられる)。
# frontend-external (LoadBalancer) は作らない (k6 は frontend:80 を叩く)。
# Pod 内ポート衝突なし: frontend 8080 / reco 8090 | payment 50051 / email 8080 | currency 7000 / shipping 50051。
# localhost にしたのは frontend→reco の 1 本だけ (frontend→reco の remap 先 8090)。reco→catalog 等は Service 名のまま。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-readiness-probe" }
        livenessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-liveness-probe" }
        env:
        - { name: PORT, value: "8080" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
        - { name: RECOMMENDATION_SERVICE_ADDR, value: "localhost:8090" }   # ← 同居先へ loopback
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: CHECKOUT_SERVICE_ADDR, value: "checkoutservice:5050" }
        - { name: AD_SERVICE_ADDR, value: "adservice:9555" }
        - { name: SHOPPING_ASSISTANT_SERVICE_ADDR, value: "shoppingassistantservice:80" }
        - { name: ENABLE_PROFILER, value: "0" }
        resources:
          requests: { cpu: 1000m, memory: 128Mi }
          limits:   { cpu: 1600m, memory: 256Mi }

      - name: recommendation
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.3
        ports:
        - containerPort: 8090
        readinessProbe:
          periodSeconds: 5
          grpc: { port: 8090 }
        livenessProbe:
          periodSeconds: 30
          grpc: { port: 8090 }
        env:
        - { name: PORT, value: "8090" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 1200m, memory: 220Mi }
          limits:   { cpu: 1600m, memory: 450Mi }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  labels:
    app: paymentservice
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: paymentservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: payment
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.3
        ports:
        - containerPort: 50051
        readinessProbe: { grpc: { port: 50051 } }
        livenessProbe:  { grpc: { port: 50051 } }
        env:
        - { name: PORT, value: "50051" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 200m, memory: 64Mi }
          limits:   { cpu: 300m, memory: 128Mi }

      - name: email
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          grpc: { port: 8080 }
        livenessProbe:
          periodSeconds: 30
          grpc: { port: 8080 }
        env:
        - { name: PORT, value: "8080" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 200m, memory: 64Mi }
          limits:   { cpu: 300m, memory: 128Mi }

