# pairsP1: ペア距離実験 (P の近さ) の第1配置 (2026-10-13 作成、同日ペア入替で全面改訂)。3 Pod を同時に同居させる。
#   frontend            + adservice              (frontend → ad は localhost:9555 = 実辺あり)
#   checkoutservice     + shippingservice        (checkout → shipping は localhost:50051 = 実辺あり)
#   productcatalogservice + recommendationservice (reco → catalog は localhost:3550 = 実辺あり。pairsX.yaml と同じブロック)
# 束ねていない cartservice(+redis-cart) / currencyservice / paymentservice / emailservice は km2/normal のまま (bundle-vs-loss2.sh の apply_arm が別途 apply)。
# Deployment 名とコンテナ名 (枠の置換 apply_rightsize.py / sample_hpa.py と整合):
#   Deployment frontend              : コンテナ server(frontend:8080) / ad(9555)
#   Deployment checkoutservice       : コンテナ checkout(5050,metrics 9464) / shipping(50051)
#   Deployment productcatalogservice : コンテナ server(catalog:3550) / recommendation(reco:8080)
#   ※ ad は apply_rightsize.py の CONTAINER_TO_SERVICE に 2026-10-13 追加 (ad → adservice/server)。
# 吸収される側の Service (adservice / shippingservice / recommendationservice) は同居 Pod のラベルを向ける。
#   frontend (別 Pod 含む) からの shippingservice:50051 は checkout Pod の shipping に着く (Service 経由のまま)。
#   frontend → reco は recommendationservice:8080 のまま Service 経由で catalog Pod の reco に着く。
# frontend-external (LoadBalancer) は作らない (k6 は frontend:80 を叩く)。
# Pod 内ポート衝突なし: frontend 8080 / ad 9555 | checkout 5050,9464 / shipping 50051 | catalog 3550 / reco 8080。
# localhost にしたのは frontend→ad / checkout→shipping / reco→catalog の 3 本。他の宛先は従来の Service 名のまま。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-readiness-probe" }
        livenessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-liveness-probe" }
        env:
        - { name: PORT, value: "8080" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
        - { name: RECOMMENDATION_SERVICE_ADDR, value: "recommendationservice:8080" }
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: CHECKOUT_SERVICE_ADDR, value: "checkoutservice:5050" }
        - { name: AD_SERVICE_ADDR, value: "localhost:9555" }   # ← 同居先へ loopback
        - { name: SHOPPING_ASSISTANT_SERVICE_ADDR, value: "shoppingassistantservice:80" }
        - { name: ENABLE_PROFILER, value: "0" }
        resources:
          requests: { cpu: 1000m, memory: 128Mi }
          limits:   { cpu: 1600m, memory: 256Mi }

      - name: ad
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.3
        ports:
        - containerPort: 9555
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 15
          grpc: { port: 9555 }
        livenessProbe:
          initialDelaySeconds: 50
          periodSeconds: 30
          grpc: { port: 9555 }
        env:
        - { name: PORT, value: "9555" }
        resources:
          requests: { cpu: 300m, memory: 100Mi }
          limits:   { cpu: 500m, memory: 200Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: checkoutservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: checkout
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: mizuki0118/mygo:bunpupaymail
        ports:
        - { name: grpc,    containerPort: 5050 }
        - { name: metrics, containerPort: 9464 }
        readinessProbe: { grpc: { port: 5050 } }
        livenessProbe:  { grpc: { port: 5050 } }
        env:
        - { name: PORT, value: "5050" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: SHIPPING_SERVICE_ADDR, value: "localhost:50051" }   # ← 同居先へ loopback
        - { name: PAYMENT_SERVICE_ADDR, value: "paymentservice:50051" }
        - { name: EMAIL_SERVICE_ADDR, value: "emailservice:5000" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
        resources:
          requests: { cpu: 800m, memory: 64Mi }
          limits:   { cpu: 1200m, memory: 128Mi }

      - name: shipping
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/shippingservice:v0.10.3
        ports:
        - containerPort: 50051
        readinessProbe:
          periodSeconds: 5
          grpc: { port: 50051 }
        livenessProbe:
          grpc: { port: 50051 }
        env:
        - { name: PORT, value: "50051" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 320m, memory: 64Mi }
          limits:   { cpu: 560m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.3
        ports:
        - containerPort: 3550
        readinessProbe: { grpc: { port: 3550 } }
        livenessProbe:  { grpc: { port: 3550 } }
        env:
        - { name: PORT, value: "3550" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 600m, memory: 64Mi }
          limits:   { cpu: 1000m, memory: 128Mi }

      - name: recommendation
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          grpc: { port: 8080 }
        livenessProbe:
          periodSeconds: 30
          grpc: { port: 8080 }
        env:
        - { name: PORT, value: "8080" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "localhost:3550" }   # ← 同居先へ loopback
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 1200m, memory: 220Mi }
          limits:   { cpu: 1600m, memory: 450Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  labels: { app: adservice }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: grpc, port: 9555, targetPort: 9555 }
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels: { app: checkoutservice }
spec:
  type: ClusterIP
  selector: { app: checkoutservice }
  ports:
  - { name: grpc, port: 5050, targetPort: 5050 }
  - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  labels: { app: shippingservice }
spec:
  type: ClusterIP
  selector: { app: checkoutservice }
  ports:
  - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels: { app: productcatalogservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 3550, targetPort: 3550 }
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels: { app: recommendationservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: adservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: checkoutservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: shippingservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: productcatalogservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: recommendationservice }
