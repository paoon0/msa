# frontrecocartcatalog: frontend + recommendation + productcatalog + cartservice を 1 Pod に同居。
#   2026-09-03 作成。3つ束ね(frontrecocatalogcart.yaml)に cartservice を足した4つ束ね。
#   redis-cart は束ねの外(別Pod)。cart は redis に ClusterIP で到達する。
#   HPAでPodが増えると cart も複製されるが、状態は redis 側にあるので分裂しない。
#   内部通信の loopback 化:
#     frontend→recommendation : RECOMMENDATION_SERVICE_ADDR=localhost:8090 (reco は 8080→8090 remap)
#     frontend→productcatalog  : PRODUCT_CATALOG_SERVICE_ADDR=localhost:3550
#     frontend→cart            : CART_SERVICE_ADDR=localhost:7070 (同居)
#     recommendation→catalog   : PRODUCT_CATALOG_SERVICE_ADDR=localhost:3550 (両方同居ゆえ loopback)
#     cart→redis               : REDIS_ADDR=redis-cart:6379 (redisは外, ClusterIP)
#   他ホップ(currency/shipping/checkout/ad)は ClusterIP。
# catalog / cart は checkout からも呼ばれるので、productcatalogservice / cartservice の Service を
#   app=frontend Pod に向ける。reco は Pod 内からしか使わないので Service 無し。
# ポート競合なし(frontend 8080 / reco 8090 / catalog 3550 / cart 7070 / redis 6379)。
# resources は all.yaml と同値(公平比較)。Pod 合計 requests ≈ 3.66 vCPU。
# HPA 同梱: Deployment/frontend を CPU 70% 目標で 1〜5 レプリカにオートスケール(HPAには requests 必須=設定済)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.3
          ports:
          - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "localhost:3550"           # ← 同居 loopback
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "localhost:7070"           # ← 同居 loopback
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "localhost:8090"           # ← 同居 loopback(reco remap 8090)
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "checkoutservice:5050"
          - name: AD_SERVICE_ADDR
            value: "adservice:9555"
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            value: "shoppingassistantservice:80"
          - name: ENABLE_PROFILER
            value: "0"
          resources:
            requests: { cpu: 1000m, memory: 128Mi }
            limits:   { cpu: 1600m, memory: 256Mi }

        - name: recommendation
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.3
          ports:
          - containerPort: 8090
          env:
          - name: PORT
            value: "8090"                     # ← remap(frontend 8080 と競合回避)
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "localhost:3550"           # ← catalog も同居 → loopback
          - name: DISABLE_PROFILER
            value: "1"
          readinessProbe:
            periodSeconds: 5
            grpc: { port: 8090 }
          livenessProbe:
            periodSeconds: 30
            grpc: { port: 8090 }
          resources:
            requests: { cpu: 1200m, memory: 220Mi }
            limits:   { cpu: 1600m, memory: 450Mi }

        - name: productcatalog
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.3
          ports:
          - containerPort: 3550
          env:
          - name: PORT
            value: "3550"
          - name: DISABLE_PROFILER
            value: "1"
          readinessProbe:
            grpc: { port: 3550 }
          livenessProbe:
            grpc: { port: 3550 }
          resources:
            requests: { cpu: 600m, memory: 64Mi }
            limits:   { cpu: 1000m, memory: 128Mi }

        - name: cartservice
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/cartservice:v0.10.3
          ports:
          - containerPort: 7070
          env:
          - name: REDIS_ADDR
            value: "redis-cart:6379"          # ← 夏休み実験: HPAでPodを増やすとredisが分裂するため外出し
          readinessProbe:
            initialDelaySeconds: 15
            grpc:
              port: 7070
          livenessProbe:
            initialDelaySeconds: 50
            periodSeconds: 30
            grpc:
              port: 7070
          resources:
            requests:
              cpu: 560m
              memory: 64Mi
            limits:
              cpu: 960m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  labels: { app: frontend }
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
  - { name: http, port: 80, targetPort: 8080 }
---
# catalog は Pod 内に居る → checkout(別Pod) が productcatalogservice:3550 で届くよう app=frontend に向ける
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels: { app: productcatalogservice }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: grpc, port: 3550, targetPort: 3550 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: productcatalogservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: recommendationservice }
---
# HPA: 束ねた frontend Pod を CPU 平均 70% 目標で 1〜5 レプリカにオートスケール。
# HPA は utilization=使用量/requests で計算するので resources.requests(上で設定)が必須。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
