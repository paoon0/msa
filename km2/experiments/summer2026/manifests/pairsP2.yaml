# pairsP2: ペア距離実験 (P の近さ) の第2配置 (2026-10-13 作成、同日ペア入替で全面改訂)。2 Pod を同時に同居させる。
#   frontend              + cartservice      (frontend → cart は localhost:7070 = 実辺あり。frontcart.yaml と同じ redis 外出し版)
#   productcatalogservice + checkoutservice  (checkout → catalog は localhost:3550 = 実辺あり。catalogcheckout.yaml と同じホスト = catalog 側)
# 束ねていない currencyservice / paymentservice / shippingservice / emailservice / recommendationservice / adservice は km2/normal のまま。
# ★ redis-cart は別 Pod。km2/normal/cartservice.yaml は cartservice と redis-cart を 1 ファイルに持つので、cartservice を normal から外すと
#   redis-cart も消える。ドライバ (apply_arm の pairsP2) が manifests/redis-cart.yaml を別途 apply する (frontcart アームと同じ)。
# Deployment 名とコンテナ名 (枠の置換 apply_rightsize.py / sample_hpa.py と整合):
#   Deployment frontend              : コンテナ server(frontend:8080) / cartservice(7070。REDIS_ADDR=redis-cart:6379)
#   Deployment productcatalogservice : コンテナ server(catalog:3550) / checkout(5050,metrics 9464)
# 吸収される側の Service (cartservice / checkoutservice) は同居 Pod のラベルを向ける。
#   cart は checkout (catalog Pod 内) からも cartservice:7070 の Service 経由で frontend Pod に着く。
#   frontend → checkout は checkoutservice:5050 のまま Service 経由で catalog Pod の checkout に着く。
#   frontend / reco → catalog は productcatalogservice:3550 のまま Service 経由 (catalog Pod は自分自身のラベル)。
# frontend-external (LoadBalancer) は作らない (k6 は frontend:80 を叩く)。
# Pod 内ポート衝突なし: frontend 8080 / cart 7070 | catalog 3550 / checkout 5050,9464。
# localhost にしたのは frontend→cart と checkout→catalog の 2 本。他の宛先は従来の Service 名のまま。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.3
        ports:
        - containerPort: 8080
        readinessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-readiness-probe" }
        livenessProbe:
          initialDelaySeconds: 10
          httpGet:
            path: "/_healthz"
            port: 8080
            httpHeaders:
            - { name: "Cookie", value: "shop_session-id=x-liveness-probe" }
        env:
        - { name: PORT, value: "8080" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "localhost:7070" }   # ← 同居先へ loopback
        - { name: RECOMMENDATION_SERVICE_ADDR, value: "recommendationservice:8080" }
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: CHECKOUT_SERVICE_ADDR, value: "checkoutservice:5050" }
        - { name: AD_SERVICE_ADDR, value: "adservice:9555" }
        - { name: SHOPPING_ASSISTANT_SERVICE_ADDR, value: "shoppingassistantservice:80" }
        - { name: ENABLE_PROFILER, value: "0" }
        resources:
          requests: { cpu: 1000m, memory: 128Mi }
          limits:   { cpu: 1600m, memory: 256Mi }

      - name: cartservice
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/cartservice:v0.10.3
        ports:
        - containerPort: 7070
        readinessProbe:
          initialDelaySeconds: 15
          grpc: { port: 7070 }
        livenessProbe:
          initialDelaySeconds: 50
          periodSeconds: 30
          grpc: { port: 7070 }
        env:
        - { name: REDIS_ADDR, value: "redis-cart:6379" }   # redis-cart は別 Pod (normal と同じ)
        resources:
          requests: { cpu: 560m, memory: 64Mi }
          limits:   { cpu: 960m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.3
        ports:
        - containerPort: 3550
        readinessProbe: { grpc: { port: 3550 } }
        livenessProbe:  { grpc: { port: 3550 } }
        env:
        - { name: PORT, value: "3550" }
        - { name: DISABLE_PROFILER, value: "1" }
        resources:
          requests: { cpu: 600m, memory: 64Mi }
          limits:   { cpu: 1000m, memory: 128Mi }

      - name: checkout
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: mizuki0118/mygo:bunpupaymail
        ports:
        - { name: grpc,    containerPort: 5050 }
        - { name: metrics, containerPort: 9464 }
        readinessProbe: { grpc: { port: 5050 } }
        livenessProbe:  { grpc: { port: 5050 } }
        env:
        - { name: PORT, value: "5050" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "localhost:3550" }   # ← 同居先へ loopback
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: PAYMENT_SERVICE_ADDR, value: "paymentservice:50051" }
        - { name: EMAIL_SERVICE_ADDR, value: "emailservice:5000" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
        resources:
          requests: { cpu: 800m, memory: 64Mi }
          limits:   { cpu: 1200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels: { app: cartservice }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
  - { name: grpc, port: 7070, targetPort: 7070 }
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels: { app: productcatalogservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 3550, targetPort: 3550 }
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels: { app: checkoutservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 5050, targetPort: 5050 }
  - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: cartservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: productcatalogservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: checkoutservice }
