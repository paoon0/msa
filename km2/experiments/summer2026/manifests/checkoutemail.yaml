# checkoutemail: checkoutservice + emailservice を 1 Pod に同居(2026-09-07 作成)
#
# ★狙い = 「純粋な得」の対照。frontemail の鏡像。
#   取り込むエッジ: checkout → email(注文確認メール。購入1周につき1回)= 便益あり。
#   需要のズレ: どちらも購入型だけで動くので、閲覧型を積んでもほぼ同じ動き
#   (実験9/4 実測で checkout +20% / email +13%)= 損はゼロのはず。
#   ⇒ 「エッジを取り込む × 需要が揃う」= 束ねの理想形。設計則の便益項だけを単独で測る。
# email を呼ぶのは checkout だけなので emailservice Service は他から使われないが、
#   取り違え防止のため app=checkoutservice に向けたまま残す。
# ポート衝突なし(checkout 5050 / email 8080)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: checkoutservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: checkout
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            privileged: false
            readOnlyRootFilesystem: true
          image: mizuki0118/mygo:bunpupaymail
          ports:
          - { name: grpc,    containerPort: 5050 }
          - { name: metrics, containerPort: 9464 }
          readinessProbe: { grpc: { port: 5050 } }
          livenessProbe:  { grpc: { port: 5050 } }
          env:
          - { name: PORT, value: "5050" }
          - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
          - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
          - { name: PAYMENT_SERVICE_ADDR,  value: "paymentservice:50051" }
          - { name: EMAIL_SERVICE_ADDR,    value: "localhost:8080" }   # ← 同居先へ loopback
          - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
          - { name: CART_SERVICE_ADDR,     value: "cartservice:7070" }
          resources:
            requests: { cpu: 800m, memory: 64Mi }
            limits:   { cpu: 1200m, memory: 128Mi }

        - name: email
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.3
          ports:
          - containerPort: 8080
          env:
          - { name: PORT, value: "8080" }
          - { name: DISABLE_PROFILER, value: "1" }
          readinessProbe:
            periodSeconds: 5
            grpc: { port: 8080 }
          livenessProbe:
            periodSeconds: 30
            grpc: { port: 8080 }
          resources:
            requests: { cpu: 200m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels: { app: checkoutservice }
spec:
  type: ClusterIP
  selector: { app: checkoutservice }
  ports:
  - { name: grpc,    port: 5050, targetPort: 5050 }
  - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  labels: { app: emailservice }
spec:
  type: ClusterIP
  selector: { app: checkoutservice }
  ports:
  - { name: grpc, port: 5000, targetPort: 8080 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: checkoutservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: emailservice }
