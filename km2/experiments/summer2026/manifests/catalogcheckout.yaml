# catalogcheckout: productcatalogservice + checkoutservice を 1 Pod に同居(2026-09-07 作成)
#
# ★狙い = 「太いエッジ × 需要ズレ」。frontcheckout との対で、便益側だけを入れ替える。
#   取り込むエッジ: checkout → productcatalog(注文の各商品を引く)= frontend→catalog ほどではないが太い。
#   需要のズレ: 閲覧型を積むと catalog は +115% 伸びるが checkout は +20%(実験9/4 実測)。
#   ⇒ frontcheckout と同様に大きな損が出るはずだが、便益が大きい分だけ相殺されるかを見る。
# catalog は frontend / recommendation / checkout の3者から呼ばれる。checkout だけが localhost 化され、
#   frontend と recommendation は従来どおり productcatalogservice:3550(ClusterIP)で到達する。
#   したがって productcatalogservice Service のセレクタはこの Pod(app=productcatalogservice)のまま。
# checkout は frontend から呼ばれるので checkoutservice Service を同じ Pod に向ける。
# ポート衝突なし(catalog 3550 / checkout 5050)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.3
        ports:
        - containerPort: 3550
        env:
        - { name: PORT, value: "3550" }
        - { name: DISABLE_PROFILER, value: "1" }
        readinessProbe: { grpc: { port: 3550 } }
        livenessProbe:  { grpc: { port: 3550 } }
        resources:
          requests: { cpu: 600m, memory: 64Mi }
          limits:   { cpu: 1000m, memory: 128Mi }

      - name: checkout
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          privileged: false
          readOnlyRootFilesystem: true
        image: mizuki0118/mygo:bunpupaymail
        ports:
        - { name: grpc,    containerPort: 5050 }
        - { name: metrics, containerPort: 9464 }
        readinessProbe: { grpc: { port: 5050 } }
        livenessProbe:  { grpc: { port: 5050 } }
        env:
        - { name: PORT, value: "5050" }
        - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "localhost:3550" }   # ← 同居先へ loopback
        - { name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051" }
        - { name: PAYMENT_SERVICE_ADDR,  value: "paymentservice:50051" }
        - { name: EMAIL_SERVICE_ADDR,    value: "emailservice:5000" }
        - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
        - { name: CART_SERVICE_ADDR,     value: "cartservice:7070" }
        resources:
          requests: { cpu: 800m, memory: 64Mi }
          limits:   { cpu: 1200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels: { app: productcatalogservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc, port: 3550, targetPort: 3550 }
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels: { app: checkoutservice }
spec:
  type: ClusterIP
  selector: { app: productcatalogservice }
  ports:
  - { name: grpc,    port: 5050, targetPort: 5050 }
  - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: productcatalogservice }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: checkoutservice }
