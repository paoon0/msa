- apiVersion: v1
  data:
    checkout.js: |
      // 開ループ負荷(k6 constant-arrival-rate): 応答を待たず一定の到着レートで投げ続ける。
      //
      // 【2種類の利用者】(2026-09-02 追加)
      //   購入型(checkout): 1周 = GET /product/{id} → POST /cart → POST /cart/checkout
      //                     (POST /cart は 303→GET /cart を k6 が自動追従するので実HTTPは4req/周)
      //   閲覧型(browse)  : 1周 = GET /product/{id} だけ。買わない。
      //   なぜ要るか: いまの負荷は全員が購入型なので、全サービスの忙しさが完全に連動している。
      //     現実には見るだけの人が大半で、その比率が変わると catalog/reco は忙しいまま
      //     cart/checkout/payment/email が暇になる。この「需要のズレ」がないと粒度損は生まれない。
      //   使い方: BROWSE_RATE を 0 より大きくすると閲覧型シナリオが有効になる。0 なら従来通り。
      // 案C: 最初の WARMUP 秒(VU立ち上げの過渡)を捨て、以降 MEASURE 秒だけをカスタム指標に記録。
      //   scenario の duration = WARMUP+MEASURE。built-in の dropped_iterations は「全体」しか取れないので、
      //   計測窓だけの取りこぼしを別に出す(2026-09-01 追加):
      //     計測窓で投げるはずだった周回数 = RATE × MEASURE(constant-arrival-rate は毎秒きっかり RATE 本開始する)
      //     実際に開始できた周回数 = m_started(窓に入ってから開始した周を、完了を待たずに数える)
      //     ⇒ dropped_win = RATE×MEASURE − m_started
      //   ※ m_iters(完了数)ではなく m_started(開始数)を使うのが肝。完了数だと、窓の終わりに走っていて
      //     打ち切られた周が「取りこぼし」に化けて、遅い回ほど過大に出てしまう。
      // 開ループの肝: 遅れても RATE を維持しようと VU を maxVUs まで動員。足りねば dropped_iterations 増=容量超過。
      import http from 'k6/http';
      import { Trend, Counter } from 'k6/metrics';

      const BASE     = __ENV.BASE     || 'http://frontend:80';
      const RATE     = parseInt(__ENV.RATE     || '100');   // 購入型の到着レート [周/秒]
      const BROWSE   = parseInt(__ENV.BROWSE_RATE || '0'); // 閲覧型の到着レート [周/秒]。0で無効
      const WARMUP   = parseInt(__ENV.WARMUP   || '30');    // 捨てる秒数
      const MEASURE  = parseInt(__ENV.MEASURE  || '180');   // 記録する秒数
      const PRE_VUS  = parseInt(__ENV.PRE_VUS  || '500');
      const MAX_VUS  = parseInt(__ENV.MAX_VUS  || '4000');

      const products = ['0PUK6V6EV0','1YMWWN1N4O','2ZYFJ3GM2N','66VCHSJNUP','6E92ZMYYFZ',
                        '9SIQT8TOJO','L9ECAV7KIM','LS4PSXUNUM','OLJCESPC7Z'];

      // ウォームアップ後だけ記録するカスタム指標
      const mDur   = new Trend('m_req_duration', true);
      // 種類別(どのリクエストが遅いか=詰まっている場所の特定に使う)
      const mProd  = new Trend('m_product', true);   // GET  /product/{id}  … frontend→catalog/ad/reco
      const mCart  = new Trend('m_cart', true);      // POST /cart          … frontend→cart(+303追従でGET /cart)
      const mChk   = new Trend('m_checkout', true);  // POST /cart/checkout … frontend→checkout→(cart,catalog,shipping,payment,email,currency)
      const mStart = new Counter('m_started');   // 購入型: 計測窓で「開始できた」周(完了は問わない)
      // 閲覧型(商品ページを見るだけ)の指標。購入型と混ぜない
      const mbStart = new Counter('mb_started');
      const mbDur   = new Trend('mb_duration', true);
      const mbFail  = new Counter('mb_failed');
      const mReqs  = new Counter('m_reqs');
      const mIters = new Counter('m_iters');
      const mFail  = new Counter('m_failed');

      export const options = {
        discardResponseBodies: true,
        summaryTrendStats: ['avg','med','p(90)','p(95)','p(99)','max'],
        scenarios: scenarios(),
      };

      // 閲覧型が有効なときだけシナリオを2本にする。
      // VU は到着レートの比で配分する(足りないと開ループが維持できず取りこぼしになる)。
      function scenarios() {
        const dur = `${WARMUP + MEASURE}s`;
        // 閲覧型だけを流したいとき(RATE=0)。エッジ単位の通信量を測るのに使う:
        // 閲覧型は checkout / email / payment / shipping を一切呼ばないので、
        // それらの Pod のネットワーク量がゼロになり、残りのエッジが分離して読める。
        if (RATE <= 0) {
          return {
            browse: { executor: 'constant-arrival-rate', exec: 'browseFlow',
                      rate: BROWSE, timeUnit: '1s', duration: dur,
                      preAllocatedVUs: PRE_VUS, maxVUs: MAX_VUS },
          };
        }
        if (BROWSE <= 0) {
          return {
            checkout: { executor: 'constant-arrival-rate', exec: 'checkoutFlow',
                        rate: RATE, timeUnit: '1s', duration: dur,
                        preAllocatedVUs: PRE_VUS, maxVUs: MAX_VUS },
          };
        }
        const total = RATE + BROWSE;
        const share = (n, x) => Math.max(10, Math.round(n * x / total));
        return {
          checkout: { executor: 'constant-arrival-rate', exec: 'checkoutFlow',
                      rate: RATE, timeUnit: '1s', duration: dur,
                      preAllocatedVUs: share(PRE_VUS, RATE), maxVUs: share(MAX_VUS, RATE) },
          browse:   { executor: 'constant-arrival-rate', exec: 'browseFlow',
                      rate: BROWSE, timeUnit: '1s', duration: dur,
                      preAllocatedVUs: share(PRE_VUS, BROWSE), maxVUs: share(MAX_VUS, BROWSE) },
        };
      }

      export function setup() { return { start: Date.now() }; }

      export function checkoutFlow(data) {
        const measuring = (Date.now() - data.start) / 1000 >= WARMUP;
        if (measuring) mStart.add(1);            // 開始時点で数える(打ち切られても計上される)
        const p = products[Math.floor(Math.random() * products.length)];
        const rs = [];
        rs.push(http.get(`${BASE}/product/${p}`));
        rs.push(http.post(`${BASE}/cart`, { product_id: p, quantity: '1' }));
        rs.push(http.post(`${BASE}/cart/checkout`, {
          email: 'test@test.com', street_address: 'Tokyo', zip_code: '100000',
          city: 'Tokyo', state: 'Tokyo', country: 'Tokyo',
          credit_card_number: '4111111111111111',
          credit_card_expiration_month: '1', credit_card_expiration_year: '2090',
          credit_card_cvv: '100',
        }));
        if (measuring) {
          mProd.add(rs[0].timings.duration);
          mCart.add(rs[1].timings.duration);
          mChk.add(rs[2].timings.duration);
          for (const r of rs) {
            mDur.add(r.timings.duration);
            mReqs.add(1);
            if (r.status >= 400 || r.status === 0) mFail.add(1);
          }
          mIters.add(1);
        }
      }

      // 閲覧型: 商品ページを見るだけ(frontend → productcatalog / recommendation / ad)
      export function browseFlow(data) {
        const measuring = (Date.now() - data.start) / 1000 >= WARMUP;
        if (measuring) mbStart.add(1);
        const p = products[Math.floor(Math.random() * products.length)];
        const r = http.get(`${BASE}/product/${p}`);
        if (measuring) {
          mbDur.add(r.timings.duration);
          if (r.status >= 400 || r.status === 0) mbFail.add(1);
        }
      }

      export function handleSummary(data) {
        const m = data.metrics;
        const g = (x, k) => (m[x] && m[x].values[k] != null) ? m[x].values[k] : null;
        const reqs = g('m_reqs', 'count') || 0;
        const iters = g('m_iters', 'count') || 0;
        const fail = g('m_failed', 'count') || 0;
        const started = g('m_started', 'count') || 0;
        const droppedWin = Math.max(0, Math.round(RATE * MEASURE - started));
        const bStarted = g('mb_started', 'count') || 0;
        const bDropped = BROWSE > 0 ? Math.max(0, Math.round(BROWSE * MEASURE - bStarted)) : 0;
        const out = {
          target_rate: RATE, measure_s: MEASURE,
          iters: iters, iter_rate: iters / MEASURE,          // 達成 周/秒(ウォームアップ除外)
          reqs: reqs, rps: reqs / MEASURE,                    // 達成 req/s
          dropped: g('dropped_iterations', 'count') || 0,     // 全体(ウォームアップ込み。参考値)
          dropped_win: droppedWin,                            // ★計測窓だけの取りこぼし(判定はこちらを使う)
          started: started,                                   // 計測窓で開始できた周
          failed_rate: reqs ? fail / reqs : 0,
          p50: g('m_req_duration', 'med'),
          p90: g('m_req_duration', 'p(90)'),
          p95: g('m_req_duration', 'p(95)'),
          p99: g('m_req_duration', 'p(99)'),
          avg: g('m_req_duration', 'avg'),
          max: g('m_req_duration', 'max'),
          // 種類別 p50/p99 (詰まっている場所の特定用)
          prod_p50: g('m_product', 'med'),  prod_p99: g('m_product', 'p(99)'),
          cart_p50: g('m_cart', 'med'),     cart_p99: g('m_cart', 'p(99)'),
          chk_p50:  g('m_checkout', 'med'), chk_p99:  g('m_checkout', 'p(99)'),
          // 閲覧型(BROWSE_RATE=0 のときは 0 のまま)
          browse_rate_target: BROWSE,
          browse_started: bStarted,
          browse_rate: BROWSE > 0 ? bStarted / MEASURE : 0,
          browse_dropped_win: bDropped,
          browse_p50: g('mb_duration', 'med'), browse_p99: g('mb_duration', 'p(99)'),
          browse_failed: g('mb_failed', 'count') || 0,
        };
        return { stdout: '\n@@@K6_BEGIN@@@\n' + JSON.stringify(out) + '\n@@@K6_END@@@\n' };
      }
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"checkout.js":"// 開ループ負荷(k6 constant-arrival-rate): 応答を待たず一定の到着レートで投げ続ける。\n//\n// 【2種類の利用者】(2026-09-02 追加)\n//   購入型(checkout): 1周 = GET /product/{id} → POST /cart → POST /cart/checkout\n//                     (POST /cart は 303→GET /cart を k6 が自動追従するので実HTTPは4req/周)\n//   閲覧型(browse)  : 1周 = GET /product/{id} だけ。買わない。\n//   なぜ要るか: いまの負荷は全員が購入型なので、全サービスの忙しさが完全に連動している。\n//     現実には見るだけの人が大半で、その比率が変わると catalog/reco は忙しいまま\n//     cart/checkout/payment/email が暇になる。この「需要のズレ」がないと粒度損は生まれない。\n//   使い方: BROWSE_RATE を 0 より大きくすると閲覧型シナリオが有効になる。0 なら従来通り。\n// 案C: 最初の WARMUP 秒(VU立ち上げの過渡)を捨て、以降 MEASURE 秒だけをカスタム指標に記録。\n//   scenario の duration = WARMUP+MEASURE。built-in の dropped_iterations は「全体」しか取れないので、\n//   計測窓だけの取りこぼしを別に出す(2026-09-01 追加):\n//     計測窓で投げるはずだった周回数 = RATE × MEASURE(constant-arrival-rate は毎秒きっかり RATE 本開始する)\n//     実際に開始できた周回数 = m_started(窓に入ってから開始した周を、完了を待たずに数える)\n//     ⇒ dropped_win = RATE×MEASURE − m_started\n//   ※ m_iters(完了数)ではなく m_started(開始数)を使うのが肝。完了数だと、窓の終わりに走っていて\n//     打ち切られた周が「取りこぼし」に化けて、遅い回ほど過大に出てしまう。\n// 開ループの肝: 遅れても RATE を維持しようと VU を maxVUs まで動員。足りねば dropped_iterations 増=容量超過。\nimport http from 'k6/http';\nimport { Trend, Counter } from 'k6/metrics';\n\nconst BASE     = __ENV.BASE     || 'http://frontend:80';\nconst RATE     = parseInt(__ENV.RATE     || '100');   // 購入型の到着レート [周/秒]\nconst BROWSE   = parseInt(__ENV.BROWSE_RATE || '0'); // 閲覧型の到着レート [周/秒]。0で無効\nconst WARMUP   = parseInt(__ENV.WARMUP   || '30');    // 捨てる秒数\nconst MEASURE  = parseInt(__ENV.MEASURE  || '180');   // 記録する秒数\nconst PRE_VUS  = parseInt(__ENV.PRE_VUS  || '500');\nconst MAX_VUS  = parseInt(__ENV.MAX_VUS  || '4000');\n\nconst products = ['0PUK6V6EV0','1YMWWN1N4O','2ZYFJ3GM2N','66VCHSJNUP','6E92ZMYYFZ',\n                  '9SIQT8TOJO','L9ECAV7KIM','LS4PSXUNUM','OLJCESPC7Z'];\n\n// ウォームアップ後だけ記録するカスタム指標\nconst mDur   = new Trend('m_req_duration', true);\n// 種類別(どのリクエストが遅いか=詰まっている場所の特定に使う)\nconst mProd  = new Trend('m_product', true);   // GET  /product/{id}  … frontend→catalog/ad/reco\nconst mCart  = new Trend('m_cart', true);      // POST /cart          … frontend→cart(+303追従でGET /cart)\nconst mChk   = new Trend('m_checkout', true);  // POST /cart/checkout … frontend→checkout→(cart,catalog,shipping,payment,email,currency)\nconst mStart = new Counter('m_started');   // 購入型: 計測窓で「開始できた」周(完了は問わない)\n// 閲覧型(商品ページを見るだけ)の指標。購入型と混ぜない\nconst mbStart = new Counter('mb_started');\nconst mbDur   = new Trend('mb_duration', true);\nconst mbFail  = new Counter('mb_failed');\nconst mReqs  = new Counter('m_reqs');\nconst mIters = new Counter('m_iters');\nconst mFail  = new Counter('m_failed');\n\nexport const options = {\n  discardResponseBodies: true,\n  summaryTrendStats: ['avg','med','p(90)','p(95)','p(99)','max'],\n  scenarios: scenarios(),\n};\n\n// 閲覧型が有効なときだけシナリオを2本にする。\n// VU は到着レートの比で配分する(足りないと開ループが維持できず取りこぼしになる)。\nfunction scenarios() {\n  const dur = `${WARMUP + MEASURE}s`;\n  // 閲覧型だけを流したいとき(RATE=0)。エッジ単位の通信量を測るのに使う:\n  // 閲覧型は checkout / email / payment / shipping を一切呼ばないので、\n  // それらの Pod のネットワーク量がゼロになり、残りのエッジが分離して読める。\n  if (RATE \u003c= 0) {\n    return {\n      browse: { executor: 'constant-arrival-rate', exec: 'browseFlow',\n                rate: BROWSE, timeUnit: '1s', duration: dur,\n                preAllocatedVUs: PRE_VUS, maxVUs: MAX_VUS },\n    };\n  }\n  if (BROWSE \u003c= 0) {\n    return {\n      checkout: { executor: 'constant-arrival-rate', exec: 'checkoutFlow',\n                  rate: RATE, timeUnit: '1s', duration: dur,\n                  preAllocatedVUs: PRE_VUS, maxVUs: MAX_VUS },\n    };\n  }\n  const total = RATE + BROWSE;\n  const share = (n, x) =\u003e Math.max(10, Math.round(n * x / total));\n  return {\n    checkout: { executor: 'constant-arrival-rate', exec: 'checkoutFlow',\n                rate: RATE, timeUnit: '1s', duration: dur,\n                preAllocatedVUs: share(PRE_VUS, RATE), maxVUs: share(MAX_VUS, RATE) },\n    browse:   { executor: 'constant-arrival-rate', exec: 'browseFlow',\n                rate: BROWSE, timeUnit: '1s', duration: dur,\n                preAllocatedVUs: share(PRE_VUS, BROWSE), maxVUs: share(MAX_VUS, BROWSE) },\n  };\n}\n\nexport function setup() { return { start: Date.now() }; }\n\nexport function checkoutFlow(data) {\n  const measuring = (Date.now() - data.start) / 1000 \u003e= WARMUP;\n  if (measuring) mStart.add(1);            // 開始時点で数える(打ち切られても計上される)\n  const p = products[Math.floor(Math.random() * products.length)];\n  const rs = [];\n  rs.push(http.get(`${BASE}/product/${p}`));\n  rs.push(http.post(`${BASE}/cart`, { product_id: p, quantity: '1' }));\n  rs.push(http.post(`${BASE}/cart/checkout`, {\n    email: 'test@test.com', street_address: 'Tokyo', zip_code: '100000',\n    city: 'Tokyo', state: 'Tokyo', country: 'Tokyo',\n    credit_card_number: '4111111111111111',\n    credit_card_expiration_month: '1', credit_card_expiration_year: '2090',\n    credit_card_cvv: '100',\n  }));\n  if (measuring) {\n    mProd.add(rs[0].timings.duration);\n    mCart.add(rs[1].timings.duration);\n    mChk.add(rs[2].timings.duration);\n    for (const r of rs) {\n      mDur.add(r.timings.duration);\n      mReqs.add(1);\n      if (r.status \u003e= 400 || r.status === 0) mFail.add(1);\n    }\n    mIters.add(1);\n  }\n}\n\n// 閲覧型: 商品ページを見るだけ(frontend → productcatalog / recommendation / ad)\nexport function browseFlow(data) {\n  const measuring = (Date.now() - data.start) / 1000 \u003e= WARMUP;\n  if (measuring) mbStart.add(1);\n  const p = products[Math.floor(Math.random() * products.length)];\n  const r = http.get(`${BASE}/product/${p}`);\n  if (measuring) {\n    mbDur.add(r.timings.duration);\n    if (r.status \u003e= 400 || r.status === 0) mbFail.add(1);\n  }\n}\n\nexport function handleSummary(data) {\n  const m = data.metrics;\n  const g = (x, k) =\u003e (m[x] \u0026\u0026 m[x].values[k] != null) ? m[x].values[k] : null;\n  const reqs = g('m_reqs', 'count') || 0;\n  const iters = g('m_iters', 'count') || 0;\n  const fail = g('m_failed', 'count') || 0;\n  const started = g('m_started', 'count') || 0;\n  const droppedWin = Math.max(0, Math.round(RATE * MEASURE - started));\n  const bStarted = g('mb_started', 'count') || 0;\n  const bDropped = BROWSE \u003e 0 ? Math.max(0, Math.round(BROWSE * MEASURE - bStarted)) : 0;\n  const out = {\n    target_rate: RATE, measure_s: MEASURE,\n    iters: iters, iter_rate: iters / MEASURE,          // 達成 周/秒(ウォームアップ除外)\n    reqs: reqs, rps: reqs / MEASURE,                    // 達成 req/s\n    dropped: g('dropped_iterations', 'count') || 0,     // 全体(ウォームアップ込み。参考値)\n    dropped_win: droppedWin,                            // ★計測窓だけの取りこぼし(判定はこちらを使う)\n    started: started,                                   // 計測窓で開始できた周\n    failed_rate: reqs ? fail / reqs : 0,\n    p50: g('m_req_duration', 'med'),\n    p90: g('m_req_duration', 'p(90)'),\n    p95: g('m_req_duration', 'p(95)'),\n    p99: g('m_req_duration', 'p(99)'),\n    avg: g('m_req_duration', 'avg'),\n    max: g('m_req_duration', 'max'),\n    // 種類別 p50/p99 (詰まっている場所の特定用)\n    prod_p50: g('m_product', 'med'),  prod_p99: g('m_product', 'p(99)'),\n    cart_p50: g('m_cart', 'med'),     cart_p99: g('m_cart', 'p(99)'),\n    chk_p50:  g('m_checkout', 'med'), chk_p99:  g('m_checkout', 'p(99)'),\n    // 閲覧型(BROWSE_RATE=0 のときは 0 のまま)\n    browse_rate_target: BROWSE,\n    browse_started: bStarted,\n    browse_rate: BROWSE \u003e 0 ? bStarted / MEASURE : 0,\n    browse_dropped_win: bDropped,\n    browse_p50: g('mb_duration', 'med'), browse_p99: g('mb_duration', 'p(99)'),\n    browse_failed: g('mb_failed', 'count') || 0,\n  };\n  return { stdout: '\\n@@@K6_BEGIN@@@\\n' + JSON.stringify(out) + '\\n@@@K6_END@@@\\n' };\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"creationTimestamp":null,"name":"k6-script","namespace":"exp"}}
