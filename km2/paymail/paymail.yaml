#Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  labels:
    app: paymentservice
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        sidecar.istio.io/proxyCPU: "60m"
        sidecar.istio.io/proxyCPULimit: "100m"
        prometheus.io/scrape: "true"
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15090"
      labels:
        app: paymentservice
    spec:
      serviceAccountName: paymentservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: email
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              #drop:
              #  - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.3
          ports:
          - containerPort: 8080
          env:
          - name: PORT
            value: "8080"
          - name: DISABLE_PROFILER
            value: "1"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 50
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 50
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              cpu: 130m
              memory: 128Mi

        - name: payment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
            #drop:
            #    - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.3
          ports:
            - containerPort: 50051
          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              cpu: 130m
              memory: 128Mi
---
#podにトラフィックを流すために必要
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  labels:
    app: paymentservice
spec:
  type: ClusterIP
  selector:
    app: paymentservice
  ports:
  - name: payment
    port: 50051
    targetPort: 50051
  - name: email
    port: 5000
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymentservice