#Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/proxyCPU: "640m"
        sidecar.istio.io/proxyCPULimit: "1200m"
        prometheus.io/scrape: "true"
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15090"
      labels:
        app: checkoutservice
    spec:
      serviceAccountName: checkoutservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: checkout
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          #image: us-central1-docker.pkg.dev/google-samples/microservices-demo/checkoutservice:v0.10.3
          image: mizuki0118/mygo:exp
          #checkoutserviceは5050に存在
          ports:
            - name: grpc
              containerPort: 5050

            - name: metrics
              containerPort: 9464
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          env:
          - name: PORT
            value: "5050"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcatalogservice:3550"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"

          - name: PAYMENT_SERVICE_ADDR
            value: "paymentservice:50051"
          #  value: "localhost:50051"
          - name: EMAIL_SERVICE_ADDR
            #value: "emailservice:5000"
            value: "localhost:8080"
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "cartservice:7070"
          resources:
            requests:
              cpu: 800m
              memory: 64Mi
            limits:
              cpu: 1200m
              memory: 128Mi


        - name: email
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              #drop:
              #  - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.3
          ports:
          - containerPort: 8080
          env:
          - name: PORT
            value: "8080"
          - name: DISABLE_PROFILER
            value: "1"
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 50
            grpc:
              port: 8080
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 50
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
#podにトラフィックを流すために必要
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  type: ClusterIP
  selector:
    app: checkoutservice
  ports:
  - name: grpc
    port: 5050
    targetPort: 5050
  - name: metrics
    port: 9464
    targetPort: 9464
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkoutservice
