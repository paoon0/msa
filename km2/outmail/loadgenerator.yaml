apiVersion: batch/v1
kind: Job
metadata:
  name: loadgenerator
  labels:
    app: loadgenerator

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: loadgenerator
      annotations:
        sidecar.istio.io/inject: "false"
        sidecar.istio.io/proxyCPU: "5m"
        sidecar.istio.io/proxyCPULimit: "10m"
        prometheus.io/scrape: "true"
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15090"

    spec:
      serviceAccountName: loadgenerator
      terminationGracePeriodSeconds: 5
      restartPolicy: Never

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      initContainers:
      - name: frontend-check
        image: busybox:latest

        command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."

            STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')

            if [ $STATUSCODE -eq 200 ]; then
              echo "Frontend is reachable."
              exit 0
            fi

            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"

            sleep $RETRY_INTERVAL
          done

          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true

        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"

      containers:
      - name: main
        image: mizuki0118/mylocust:run1

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true

        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"

        - name: USERS
          value: "4"

        - name: RATE
          value: "1"

        - name: RUN_TIME
          value: "13m"

        resources:
          requests:
            cpu: 150m
            memory: 512Mi

          limits:
            cpu: 200m
            memory: 1024Mi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgenerator